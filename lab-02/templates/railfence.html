<!DOCTYPE html>
<html lang="en">
<head>
    <title>Rail Fence Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body {
            background-color: #f8f9fa;
            color: #343a40;
        }
        .section {
            margin-top: 30px;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .btn {
            border-radius: 20px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center mt-4 text-primary">Rail Fence Cipher</h2>
        
        <!-- Encryption Section -->
        <section class="section">
            <div class="card p-4">
                <h4 class="card-title text-secondary">Encryption</h4>
                <form method="POST" action="/railfence/encrypt">
                    <div class="mb-3">
                        <label class="form-label">Plain Text:</label>
                        <input type="text" class="form-control" name="inputPlainText" placeholder="Enter Plain Text" required autofocus/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Key (Number of Rails):</label>
                        <input type="number" class="form-control" name="inputKey" placeholder="Enter Number of Rails" required min="2"/>
                    </div>
                    <button type="submit" class="btn btn-primary">Encrypt</button>
                </form>
            </div>
        </section>

        <!-- Decryption Section -->
        <section class="section">
            <div class="card p-4">
                <h4 class="card-title text-secondary">Decryption</h4>
                <form method="POST" action="/railfence/decrypt">
                    <div class="mb-3">
                        <label class="form-label">Cipher Text:</label>
                        <input type="text" class="form-control" name="inputCipherText" placeholder="Enter Cipher Text" required/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Key (Number of Rails):</label>
                        <input type="number" class="form-control" name="inputKey" placeholder="Enter Number of Rails" required min="2"/>
                    </div>
                    <button type="submit" class="btn btn-success">Decrypt</button>
                </form>
            </div>
        </section>
    </div>
</body>
</html>
