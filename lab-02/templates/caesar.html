<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesar Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 600px;
            margin-top: 50px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            font-weight: bold;
            font-size: 28px;
            color: #007bff;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Caesar Cipher</div>
        
        <h5 class="text-primary">Encryption</h5>
        <form method="POST" action="/encrypt">
            <div class="mb-3">
                <label class="form-label">Plain text:</label>
                <input type="text" class="form-control" name="inputPlainText" placeholder="Enter plain text" required autofocus/>
            </div>
            <div class="mb-3">
                <label class="form-label">Key:</label>
                <input type="number" class="form-control" name="inputKeyPlain" placeholder="Enter key" required/>
            </div>
            <button type="submit" class="btn btn-primary w-100">Encrypt</button>
        </form>
        
        <hr>
        
        <h5 class="text-success">Decryption</h5>
        <form method="POST" action="/decrypt">
            <div class="mb-3">
                <label class="form-label">Cipher text:</label>
                <input type="text" class="form-control" name="inputCipherText" placeholder="Enter cipher text" required/>
            </div>
            <div class="mb-3">
                <label class="form-label">Key:</label>
                <input type="number" class="form-control" name="inputKeyCipher" placeholder="Enter key" required/>
            </div>
            <button type="submit" class="btn btn-success w-100">Decrypt</button>
        </form>
    </div>
</body>
</html>
